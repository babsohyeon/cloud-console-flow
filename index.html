<head>

<title>Cloud Console 시나리오별 요청 플로우</title>
<style>
:root {
  --bg: #ffffff;
  --surface-0: #f8f9fa;
  --surface-1: #ffffff;
  --border: #d1d5db;
  --border-strong: #9ca3af;
  --border-accent: #6366f1;
  --text-primary: #111827;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --text-accent: #4f46e5;
  --bg-accent: #eef2ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f3f4f6;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px;
}
.container {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  padding: 24px;
  max-width: 1300px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
h1 { font-size: 18px; font-weight: 600; color: #111827; margin-bottom: 4px; }
.subtitle { font-size: 13px; color: #6b7280; margin-bottom: 4px; }
.cats { display: flex; gap: 6px; flex-wrap: wrap; }
.cat {
  font-size: 12px; padding: 5px 12px; border-radius: 8px;
  border: 1px solid #d1d5db; background: #f8f9fa;
  color: #6b7280; cursor: pointer;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  transition: all .15s;
}
.cat:hover { border-color: #9ca3af; color: #111827; }
.cat.on { background: #111827; color: #fff; border-color: #111827; }
.scs { display: flex; gap: 5px; flex-wrap: wrap; }
.sc {
  font-size: 12px; padding: 4px 10px; border-radius: 6px;
  border: 1px solid #d1d5db; background: #f8f9fa;
  color: #6b7280; cursor: pointer;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  transition: all .15s;
}
.sc:hover { border-color: #9ca3af; color: #111827; }
.sc.on { background: #eef2ff; border-color: #6366f1; color: #4f46e5; font-weight: 500; }
.rcard {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; border-radius: 10px;
  background: #f8f9fa; border: 1px solid #d1d5db;
}
.rlabel {
  font-size: 12px; font-weight: 500; color: #4f46e5;
  background: #eef2ff; border: 1px solid #6366f1;
  padding: 2px 10px; border-radius: 6px; white-space: nowrap; flex-shrink: 0;
}
.rdesc { font-size: 12px; color: #6b7280; line-height: 1.5; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: #6b7280; }
.leg { display: flex; align-items: center; gap: 5px; }
.ld { width: 12px; height: 3px; border-radius: 2px; flex-shrink: 0; }
.steps { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.step {
  font-size: 12px; padding: 7px 10px; border-radius: 8px;
  border: 1px solid #6366f1; color: #111827;
  background: #eef2ff; display: flex; align-items: flex-start;
  gap: 8px; line-height: 1.5;
}
.sn {
  min-width: 20px; height: 20px; border-radius: 50%; font-size: 10px;
  font-weight: 600; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; background: #4f46e5; color: white; margin-top: 1px;
}
svg { width: 100%; }
@media (max-width: 600px) { .steps { grid-template-columns: 1fr; } }
</style>
</head>

let ci=0,si=0;
function renderCats(){const el=document.getElementById('cats');el.innerHTML='';C.forEach((c,i)=>{const b=document.createElement('button');b.className='cat'+(i===ci?' on':'');b.textContent=c.n;b.onclick=()=>{ci=i;si=0;renderCats();renderScs();apply();};el.appendChild(b);});}
function renderScs(){const el=document.getElementById('scs');el.innerHTML='';C[ci].sc.forEach((s,i)=>{const b=document.createElement('button');b.className='sc'+(i===si?' on':'');b.textContent=s.n;b.onclick=()=>{si=i;renderScs();apply();};el.appendChild(b);});}
function apply(){
  const s=C[ci].sc[si];
  ALL_B.forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    const rect=el.querySelector('rect');const on=s.b.includes(id);
    el.style.opacity=on?'1':'0.1';
    rect.style.stroke=on?BC[id]:'#d1d5db';rect.style.strokeWidth=on?'2':'1';
  });
  ALL_A.forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    const active=s.a.find(a=>a.id===id);
    if(active){el.style.stroke=active.c;el.style.strokeWidth='2.5';el.style.opacity='1';el.style.strokeDasharray=active.d?'5 3':'none';}
    else{el.style.stroke='#d1d5db';el.style.strokeWidth='1';el.style.opacity='0.07';el.style.strokeDasharray=id==='a-ret'?'5 3':'none';}
  });
  ALL_R.forEach(r=>{
    const dot=document.getElementById('rd-'+r);const txt=document.getElementById('r-'+r);const on=(r===s.r);
    if(dot)dot.style.fill=on?'#534AB7':'#9ca3af';
    if(txt){txt.style.fill=on?'#534AB7':'#9ca3af';txt.style.fontWeight=on?'600':'400';}
  });
  const info=RI[s.r];
  document.getElementById('rlabel').textContent=info.label;
  document.getElementById('rdesc').textContent=info.desc;
  const stEl=document.getElementById('steps');stEl.innerHTML='';
  s.s.forEach((st,i)=>{
    const d=document.createElement('div');d.className='step';
    d.innerHTML='<span class="sn">'+(i+1)+'</span><span>'+st+'</span>';
    stEl.appendChild(d);
  });
}
renderCats();renderScs();apply();
